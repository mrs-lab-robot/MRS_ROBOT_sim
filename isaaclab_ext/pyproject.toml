[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrs-robot-lab"
version = "0.1.0"
description = "Isaac Lab learning interface for the canonical MRS Robot runtime"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML>=6.0", "numpy>=1.26", "h5py>=3.10"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
