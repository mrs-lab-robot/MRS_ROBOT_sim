controller_manager:
  ros__parameters:
    # The public /joint_states broadcaster follows the controller-manager
    # update loop. Keep its target at 90 Hz; the Isaac source topic remains
    # physics-driven and is measured independently.
    update_rate: 90

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    swerve_drive_controller:
      type: swerve_controller/SwerveDriveController

    left_forward_position_controller:
      # Humble's JointGroupPositionController parameter-library path does not
      # receive the per-controller `joints` list through this spawner setup.
      # ForwardCommandController exposes the same position command interface
      # and keeps the integrated command topic contract intact.
      type: openflex_isaac_controllers/ExplicitTopicPositionController

    right_forward_position_controller:
      type: openflex_isaac_controllers/ExplicitTopicPositionController

    head_forward_position_controller:
      type: openflex_isaac_controllers/ExplicitTopicPositionController

    lift_position_controller:
      type: openflex_isaac_controllers/ExplicitTopicPositionController

    velocity_controller:
      type: forward_command_controller/ForwardCommandController

    # TopicBasedSystem exposes only standard interfaces. These compatibility
    # controllers retain the integrated public names without requiring the
    # lift hardware's CANopen-specific interfaces.
    lift_state_controller:
      type: joint_state_broadcaster/JointStateBroadcaster

    lift_manual_position_controller:
      type: forward_command_controller/ForwardCommandController

    left_forward_effort_controller:
      type: forward_command_controller/ForwardCommandController

    right_forward_effort_controller:
      type: forward_command_controller/ForwardCommandController

joint_state_broadcaster:
  ros__parameters: {}

swerve_drive_controller:
  ros__parameters:
    steering_joint_names:
      - fl_steering_joint
      - fr_steering_joint
      - bl_steering_joint
      - br_steering_joint
    wheel_joint_names:
      - fl_wheel_joint
      - fr_wheel_joint
      - bl_wheel_joint
      - br_wheel_joint

    wheel_radius: 0.075
    fl_pos_x: 0.21
    fl_pos_y: 0.2735
    fr_pos_x: 0.21
    fr_pos_y: -0.2735
    bl_pos_x: -0.21
    bl_pos_y: 0.2735
    br_pos_x: -0.21
    br_pos_y: -0.2735

    fl_steering_min: -1.5708
    fl_steering_max: 1.5708
    fr_steering_min: -1.5708
    fr_steering_max: 1.5708
    bl_steering_min: -1.5708
    bl_steering_max: 1.5708
    br_steering_min: -1.5708
    br_steering_max: 1.5708

    odom_frame_id: odom
    base_frame_id: base_link
    cmd_vel_topic: /cmd_vel
    debug_topic: /swerve_drive_controller/debug_states
    cmd_vel_timeout: 0.75
    publish_rate: 50.0
    debug_publish_rate: 20.0
    max_wheel_speed: 0.8
    wheel_accel_limit: 0.2
    enable_odom_tf: true
    steering_align_threshold: 0.10
    steering_stop_threshold: 1.05
    steering_slowdown_exponent: 1.5
    steering_global_stop_threshold: 0.45
    steering_global_slowdown_exponent: 2.5
    module_speed_deadband: 0.02
    steering_command_deadband: 0.02
    low_speed_steering_command_deadband: 0.10
    low_speed_steering_deadband_speed: 0.16

left_forward_position_controller:
  ros__parameters:
    interface_name: position
    joints:
      - openarmx_left_joint1
      - openarmx_left_joint2
      - openarmx_left_joint3
      - openarmx_left_joint4
      - openarmx_left_joint5
      - openarmx_left_joint6
      - openarmx_left_joint7
      - openarmx_left_finger_joint1

right_forward_position_controller:
  ros__parameters:
    interface_name: position
    joints:
      - openarmx_right_joint1
      - openarmx_right_joint2
      - openarmx_right_joint3
      - openarmx_right_joint4
      - openarmx_right_joint5
      - openarmx_right_joint6
      - openarmx_right_joint7
      - openarmx_right_finger_joint1

head_forward_position_controller:
  ros__parameters:
    interface_name: position
    joints:
      - openarmx_head_yaw_joint
      - openarmx_head_pitch_joint

lift_position_controller:
  ros__parameters:
    interface_name: position
    joints:
      - lift_joint

velocity_controller:
  ros__parameters:
    joints:
      - lift_joint
    interface_name: velocity
    command_topic: /velocity_controller/commands

lift_state_controller:
  ros__parameters:
    joints:
      - lift_joint
    interfaces:
      - position
      - velocity
      - effort

lift_manual_position_controller:
  ros__parameters:
    interface_name: position
    joints:
      - lift_joint

left_forward_effort_controller:
  ros__parameters:
    interface_name: effort
    joints:
      - openarmx_left_joint1
      - openarmx_left_joint2
      - openarmx_left_joint3
      - openarmx_left_joint4
      - openarmx_left_joint5
      - openarmx_left_joint6
      - openarmx_left_joint7

right_forward_effort_controller:
  ros__parameters:
    interface_name: effort
    joints:
      - openarmx_right_joint1
      - openarmx_right_joint2
      - openarmx_right_joint3
      - openarmx_right_joint4
      - openarmx_right_joint5
      - openarmx_right_joint6
      - openarmx_right_joint7
