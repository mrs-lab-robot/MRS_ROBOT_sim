controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # Joint State Broadcaster
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Left Arm Controller
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Right Arm Controller
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Lift Controller
    lift_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Head Controller
    head_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Chassis Velocity Controller
    velocity_controller:
      type: velocity_controllers/TwistStamped

    # Gripper Controllers
    left_gripper_controller:
      type: forward_command_controller/ForwardCommandController

    right_gripper_controller:
      type: forward_command_controller/ForwardCommandController


# Joint State Broadcaster Configuration
joint_state_broadcaster:
  ros__parameters:
    joints:
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
      - left_joint7
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
      - right_joint7
      - lift_joint
      - head_pitch_joint
      - head_yaw_joint
    interfaces:
      - position
      - velocity


# Left Arm Controller Configuration
left_arm_controller:
  ros__parameters:
    joints:
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
      - left_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5


# Right Arm Controller Configuration
right_arm_controller:
  ros__parameters:
    joints:
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
      - right_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5


# Lift Controller Configuration
lift_controller:
  ros__parameters:
    joints:
      - lift_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0


# Head Controller Configuration
head_controller:
  ros__parameters:
    joints:
      - head_pitch_joint
      - head_yaw_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0


# Velocity Controller Configuration
velocity_controller:
  ros__parameters:
    reference_frame: base_link
    command_joint_names:
      - fl_steering_joint
      - fl_driving_joint
      - fr_steering_joint
      - fr_driving_joint
      - rl_steering_joint
      - rl_driving_joint
      - rr_steering_joint
      - rr_driving_joint


# Gripper Controllers
left_gripper_controller:
  ros__parameters:
    joints:
      - left_gripper_joint
    interface_name: position

right_gripper_controller:
  ros__parameters:
    joints:
      - right_gripper_joint
    interface_name: position
