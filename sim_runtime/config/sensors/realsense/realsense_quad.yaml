schema_version: 1

runtime:
  mode: standalone_online_quad
  quality_level: L0_aligned_fast
  physics_hz: 90
  pacing: paced_online
  render_hz: 90
  timestamp_source: physics_simulation_time
  headless: true
  disable_viewport_updates: true
  multi_tick_required: true

queues:
  latest_size_per_camera: 2
  output_size_per_camera: 8
  ros2_queue_size: 5

cameras:
  d435_front_standalone:
    enabled: true
    model: D435
    parent_prim: /World/StandaloneSensors
    mount_prim_path: /World/StandaloneSensors/D435FrontMount
    local_pose: {translation_m: [-0.35, -0.25, 1.50], quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]}
    tick_rate_hz: 30.0
    width: 640
    height: 480
    focal_length_mm: 3.2
    near_m: 0.05
    far_m: 10.0
    calibration_id: d435_nominal_640x480_rectified_v1
    baseline_mm: 50.0
    depth_focal_length_px: 615.0
    depth_min_m: 0.30
    depth_max_m: 3.00
    imu: {enabled: false}

  d435_rear_standalone:
    enabled: true
    model: D435
    parent_prim: /World/StandaloneSensors
    mount_prim_path: /World/StandaloneSensors/D435RearMount
    local_pose: {translation_m: [-0.35, 0.25, 1.50], quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]}
    tick_rate_hz: 30.0
    width: 640
    height: 480
    focal_length_mm: 3.2
    near_m: 0.05
    far_m: 10.0
    calibration_id: d435_nominal_640x480_rectified_v1
    baseline_mm: 50.0
    depth_focal_length_px: 615.0
    depth_min_m: 0.30
    depth_max_m: 3.00
    imu: {enabled: false}

  d405_left_standalone:
    enabled: true
    model: D405
    parent_prim: /World/StandaloneSensors
    mount_prim_path: /World/StandaloneSensors/D405LeftMount
    local_pose: {translation_m: [0.35, -0.25, 1.20], quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]}
    tick_rate_hz: 30.0
    width: 640
    height: 480
    focal_length_mm: 3.2
    near_m: 0.03
    far_m: 3.0
    calibration_id: d405_nominal_640x480_rectified_v1
    baseline_mm: 18.0
    depth_focal_length_px: 615.0
    depth_min_m: 0.07
    depth_max_m: 0.50
    imu: {enabled: false}

  d405_right_standalone:
    enabled: true
    model: D405
    parent_prim: /World/StandaloneSensors
    mount_prim_path: /World/StandaloneSensors/D405RightMount
    local_pose: {translation_m: [0.35, 0.25, 1.20], quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]}
    tick_rate_hz: 30.0
    width: 640
    height: 480
    focal_length_mm: 3.2
    near_m: 0.03
    far_m: 3.0
    calibration_id: d405_nominal_640x480_rectified_v1
    baseline_mm: 18.0
    depth_focal_length_px: 615.0
    depth_min_m: 0.07
    depth_max_m: 0.50
    imu: {enabled: false}
