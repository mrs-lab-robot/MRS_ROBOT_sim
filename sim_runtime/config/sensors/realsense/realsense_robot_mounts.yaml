schema_version: 1

runtime:
  mode: robot_mounted
  quality_level: L0_aligned_fast
  physics_hz: 90
  render_hz: 60

queues:
  ros2_queue_size: 5

cameras:
  base_d435:
    enabled: true
    model: D435
    parent_prim: /World/OpenFlex/Geometry/base_link
    mount_prim_path: /World/OpenFlex/Geometry/base_link/CameraMount
    # ROS-compatible upright USD camera pose: local -Z looks along robot +X,
    # local +Y points along robot +Z, and local +X points toward robot -Y.
    local_pose: {translation_m: [0.36, 0.0, 0.055], quaternion_wxyz: [0.5, 0.5, -0.5, -0.5]}
    node_namespace: cam_base
    optical_frame: d435_color_optical_frame
    depth_optical_frame: d435_depth_optical_frame
    tick_rate_hz: 30.0
    width: 424
    height: 240
    focal_length_mm: 3.2
    near_m: 0.05
    far_m: 10.0
    calibration_id: d435_nominal_640x480_rectified_v1
    baseline_mm: 50.0
    depth_focal_length_px: 615.0
    depth_min_m: 0.30
    depth_max_m: 3.00
    imu: {enabled: false}

  head_d435:
    enabled: true
    model: D435
    parent_prim: /World/OpenFlex/Geometry/base_link/lift_carriage_link/head_pitch_link/head_yaw_link
    mount_prim_path: /World/OpenFlex/Geometry/base_link/lift_carriage_link/head_pitch_link/head_yaw_link/HeadCameraMount
    # Isaac 5.1/6.0 released head-camera adjustment, expressed in head-yaw
    # link coordinates rather than the visual mesh origin.
    local_pose: {translation_m: [0.00000032669455, 0.0665480897, 0.0535495905], quaternion_wxyz: [0.70710678, 0.70710678, 0.0, 0.0]}
    node_namespace: cam_head
    optical_frame: cam_head_color_optical_frame
    tick_rate_hz: 30.0
    width: 640
    height: 480
    focal_length_mm: 3.2
    near_m: 0.05
    far_m: 10.0
    calibration_id: d435_nominal_640x480_rectified_v1
    baseline_mm: 50.0
    depth_focal_length_px: 615.0
    depth_min_m: 0.30
    depth_max_m: 3.00
    imu: {enabled: false}

  left_wrist_d405:
    enabled: true
    model: D405
    parent_prim: /World/OpenFlex/Geometry/base_link/lift_carriage_link/openarmx_left_link1/openarmx_left_link2/openarmx_left_link3/openarmx_left_link4/openarmx_left_link5/openarmx_left_link6/openarmx_left_link7
    mount_prim_path: /World/OpenFlex/Geometry/base_link/lift_carriage_link/openarmx_left_link1/openarmx_left_link2/openarmx_left_link3/openarmx_left_link4/openarmx_left_link5/openarmx_left_link6/openarmx_left_link7/LeftWristCameraMount
    local_pose: {translation_m: [0.06720526, -0.01250108, 0.11842935], quaternion_wxyz: [0.30070580, 0.0, 0.95371695, 0.0]}
    node_namespace: cam_left
    optical_frame: cam_left_color_optical_frame
    tick_rate_hz: 30.0
    width: 480
    height: 270
    focal_length_mm: 3.2
    near_m: 0.03
    far_m: 3.0
    calibration_id: d405_nominal_640x480_rectified_v1
    baseline_mm: 18.0
    depth_focal_length_px: 615.0
    depth_min_m: 0.07
    depth_max_m: 0.50
    imu: {enabled: false}

  right_wrist_d405:
    enabled: true
    model: D405
    parent_prim: /World/OpenFlex/Geometry/base_link/lift_carriage_link/openarmx_right_link1/openarmx_right_link2/openarmx_right_link3/openarmx_right_link4/openarmx_right_link5/openarmx_right_link6/openarmx_right_link7
    mount_prim_path: /World/OpenFlex/Geometry/base_link/lift_carriage_link/openarmx_right_link1/openarmx_right_link2/openarmx_right_link3/openarmx_right_link4/openarmx_right_link5/openarmx_right_link6/openarmx_right_link7/RightWristCameraMount
    local_pose: {translation_m: [0.06721000, -0.01250000, 0.11843000], quaternion_wxyz: [-0.30070580, 0.0, -0.95371695, 0.0]}
    node_namespace: cam_right
    optical_frame: cam_right_color_optical_frame
    tick_rate_hz: 30.0
    width: 480
    height: 270
    focal_length_mm: 3.2
    near_m: 0.03
    far_m: 3.0
    calibration_id: d405_nominal_640x480_rectified_v1
    baseline_mm: 18.0
    depth_focal_length_px: 615.0
    depth_min_m: 0.07
    depth_max_m: 0.50
    imu: {enabled: false}
