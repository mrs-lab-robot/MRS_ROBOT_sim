[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrs-teleoperation-protocol"
version = "0.1.0"
description = "Simulator-independent MRS Robot teleoperation protocol and UDP transport"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
